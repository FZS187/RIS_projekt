# ========================================
# APPLICATION SETTINGS
# ========================================
spring.application.name=todo-backend
server.port=8080

# ========================================
# DATABASE CONFIGURATION (H2 - in-memory)
# ========================================
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (za debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# LOGGING
# ========================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.todobackend=DEBUG

# ========================================
# JACKSON (JSON Serialization)
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Ljubljana

# ========================================
# GOOGLE CALENDAR API
# ========================================
google.calendar.credentials.path=src/main/resources/google-credentials.json
google.calendar.id=secreyer@gmail.com

# ========================================
# SECURITY
# ========================================
# Session timeout (30 minuta)
server.servlet.session.timeout=30m

# ========================================
# CORS (ve? konfigurisano u kodu)
# ========================================
# CORS je omogu?en u WebConfig.java i SecurityConfig.java